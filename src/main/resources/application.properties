spring.application.name=hospital


spring.datasource.url=jdbc:postgresql://localhost:5432/hospital
spring.datasource.username=
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always
#spring.sql.init.data-locations=classpath:doctor.sql

third_party.api = https://jsonplaceholder.typicode.com/posts


# logging configuration
logging.level.com.ermapsh.dto=trace
logging.pattern.console=%d{dd-mm-yyyy hh:MM:ss} [%level] %c{.1} ---%m%n

# log handler
logging.file.name = application.log
logging.config=classpath:logback-spring.xml
